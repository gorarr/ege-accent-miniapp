<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ударения ЕГЭ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="card">
      <p class="tag">Задание 4 · ЕГЭ русский</p>
      <h1>Проверь ударения</h1>
      <p class="subtitle">Выбери правильный вариант и узнай результат.</p>

      <div id="quiz">
        <div class="progress" id="progress">Вопрос 1 из 10</div>
        <h2 id="question">Где правильное ударение?</h2>

        <div class="answers">
          <button id="optionA"></button>
          <button id="optionB"></button>
        </div>

        <p id="feedback"></p>
      </div>

      <div id="result" class="hidden">
        <h2 id="scoreText"></h2>
        <p id="resultText"></p>
        <button onclick="restartQuiz()">Пройти ещё раз</button>
      </div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
